name: Publish to JSR

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: jsr-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Verify dependency lock
        run: deno install --frozen

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(deno task --quiet version)"
          test "v${version}" = "${RELEASE_TAG}"

      - name: Verify package quality
        run: |
          deno task fmt
          deno task lint
          deno task check
          deno task test
          deno publish --dry-run

      - name: Publish
        run: deno publish
